[package]
name = "humas-hmmer"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Parallel alpha-satellite HOR/SF annotation: a single-binary Rust port of the HumAS-HMMER bash pipeline"
authors = ["Aleksey Komissarov <ad3002@gmail.com>"]
repository = "https://github.com/aglabx/humas_hmmer"
homepage = "https://github.com/aglabx/humas_hmmer"
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "alpha-satellite", "centromere", "hmmer"]
categories = ["command-line-utilities", "science"]
exclude = ["/.github", "/docs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
once_cell = "1"
thiserror = "2"
glob = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
