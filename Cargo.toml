[package]
name = "fasthumas"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "FastHumAS: Ultra-fast in-memory centromeric alpha-satellite HOR/SF annotation engine in pure Rust"
authors = ["Aleksey Komissarov <ad3002@gmail.com>"]
repository = "https://github.com/aglabx/fasthumas"
homepage = "https://github.com/aglabx/fasthumas"
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "alpha-satellite", "centromere", "hmmer"]
categories = ["command-line-utilities", "science"]
exclude = ["/.github", "/docs"]

[[bin]]
name = "fasthumas"
path = "src/main.rs"


[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
